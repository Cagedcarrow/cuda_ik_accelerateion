default_robot: ur10
default_seed: 42
default_repeat: 30
default_batch_sizes:
  - 100
  - 500
  - 1000
  - 5000
timing_scopes:
  - kernel_time_only
  - gpu_end_to_end_time
  - host_api_total_time
tolerances:
  position_error_m: 0.03
  orientation_error_rad: 0.5235987755982988
cuda_main_weight_level: 2
solvers:
  main:
    - cuda
    - curobo
    - pyroki
    - kdl
    - numeric_dls
  reference:
    - hjcd_ik
